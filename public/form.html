<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Submission</title>
  </head>
  <body>
    <!-- Netlify detects forms from static HTML at deploy time. The contact
         page only renders a form after the visitor picks one, so both are
         registered here; field names must match ContactPage.jsx exactly. -->
    <form name="hiring" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <textarea name="message"></textarea>
    </form>
    <form name="freelance" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="timeline" />
      <textarea name="project"></textarea>
    </form>
  </body>
</html>
