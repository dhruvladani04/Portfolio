[build]
  command = "npm run build"
  publish = "out"

# Handle form submissions
[[redirects]]
  from = "/form"
  to = "/form.html"
  status = 200

# SPA catch-all removed — every route now has a real static file/folder;
# leaving it would mask genuine 404s as 200 index.html

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
